name: Build

on:
  push:
    branches: [ integration, master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ integration, master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build FileConverter + Installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET (for dotnet restore of WiX SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Classic NuGet restore for packages.config projects
      - name: Restore NuGet packages (solution)
        shell: pwsh
        run: nuget restore FileConverter.sln

      # Restore WiX SDK to NuGet cache so MSBuild can find it
      - name: Restore Installer (WiX SDK)
        shell: pwsh
        run: dotnet restore Installer\Installer.wixproj

      # Copy WiX SDK from NuGet cache into MSBuild's Sdks folder so the default
      # SDK resolver finds it. setup-msbuild adds a shim to PATH; we use vswhere
      # to find the real MSBuild install directory.
      - name: Install WiX SDK into MSBuild Sdks folder
        shell: pwsh
        run: |
          # Find real MSBuild path via vswhere
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath 2>$null
          $msbExe = Get-ChildItem "$vsRoot\MSBuild\Current\Bin" -Filter "MSBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msbExe) {
            # Fallback: use the PATH version
            $msbExe = Get-Command msbuild.exe -ErrorAction SilentlyContinue
          }
          $msbDir = Split-Path $msbExe.FullName
          $sdksDir = Join-Path $msbDir "Sdks"
          Write-Host "MSBuild dir:  $msbDir"
          Write-Host "MSBuild Sdks: $sdksDir"

          # WiX SDK from NuGet cache
          $src = Join-Path $env:USERPROFILE ".nuget\packages\wixtoolset.sdk\5.0.2"
          if (-not (Test-Path $src)) { Write-Error "WixToolset.Sdk not in NuGet cache!"; exit 1 }
          Write-Host "WiX SDK src:  $src"

          # Copy into Sdks\WixToolset.Sdk
          $dst = Join-Path $sdksDir "WixToolset.Sdk"
          Copy-Item $src $dst -Recurse -Force
          Write-Host "Copied to: $dst"

          # Verify
          $props = Join-Path $dst "Sdk\Sdk.props"
          if (Test-Path $props) { Write-Host "OK: $props exists" }
          else { Write-Error "$props NOT found!"; Get-ChildItem $dst -Recurse | Select-Object FullName; exit 1 }

      # Build entire solution with classic msbuild.exe, exactly like VS 2022.
      # /restore lets MSBuild handle all package resolution itself (avoids
      # conflicts from the earlier dotnet restore of the wixproj).
      - name: Clean stale bin/obj (avoid MSI picking up cached old exe)
        shell: pwsh
        run: |
          Write-Host "=== Cleaning stale bin/obj folders ==="
          $paths = @(
            "Application\FileConverter\bin",
            "Application\FileConverter\obj",
            "Application\FileConverterExtension\bin",
            "Application\FileConverterExtension\obj",
            "Application\Uninstaller\bin",
            "Application\Uninstaller\obj",
            "Installer\bin",
            "Installer\obj"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Cleaned: $p"
            }
          }

      # Generate a unique patch version for each CI build to force MSI
      # MajorUpgrade to recognize installations as new versions.
      # Format: 2.2.{github_run_number} -> ensures MSI uninstalls old then installs new.
      - name: Generate unique ProductVersion
        id: version
        shell: pwsh
        run: |
          $base = "2.2"
          $revision = $env:GITHUB_RUN_NUMBER
          $version = "$base.$revision"
          Write-Host "ProductVersion: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          # Export as env var for subsequent steps (WiX preprocessor reads env.PRODUCT_VERSION)
          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV


      - name: Stamp AssemblyFileVersion with CI build number
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:PRODUCT_VERSION
          $asmVer = "$ver.0"
          $file = "Application\FileConverter\Properties\AssemblyInfo.cs"
          $text = Get-Content $file -Raw
          $text = $text -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$asmVer`")"
          $text = $text -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$asmVer`")"
          Set-Content $file $text -NoNewline
          Write-Host "Stamped $file with AssemblyVersion $asmVer"



      - name: Build Solution (Release|x64)
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Build in dependency order so FileConverter's PostBuild can copy
          # uninstall.exe into its TargetDir (required by Installer Product.wxs).
          # $(SolutionDir) must be passed explicitly because we're building
          # .csproj files directly (sln normally provides it). Note the trailing
          # backslash: MSBuild's $(SolutionDir) convention always ends with '\'.
          $slnDir = (Resolve-Path .).Path
          if (-not $slnDir.EndsWith('\')) { $slnDir = "$slnDir\" }
          Write-Host "SolutionDir = $slnDir"

          # 1) Uninstaller first (produces uninstall.exe)
          msbuild Application\Uninstaller\Uninstaller.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$slnDir" /m /v:normal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 2) FileConverterExtension (shell ext DLL)
          msbuild Application\FileConverterExtension\FileConverterExtension.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$slnDir" /m /v:normal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 3) FileConverter (main app) — its PostBuild copies uninstall.exe + Middleware files
          msbuild Application\FileConverter\FileConverter.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$slnDir" /m /v:normal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Sanity check: PostBuild must have placed these files in FileConverter's bin.
          $binDir = "Application\FileConverter\bin\x64\Release"
          $required = @("ffmpeg.exe", "gsdll64.dll", "gswin64c.exe", "uninstall.exe", "Settings.default.xml")
          foreach ($f in $required) {
              $full = Join-Path $binDir $f
              if (Test-Path $full) {
                  Write-Host "OK: $full ($((Get-Item $full).Length) bytes)"
              } else {
                  Write-Error "MISSING after PostBuild: $full"
                  exit 1
              }
          }

      # Touch all compiled outputs with a timestamp that will display correctly
      # on the end user's clock. Root cause: WiX writes CAB entries using the
      # source file's local wall-clock time. On a UTC CI runner, that becomes
      # the UTC value written as if it were local. Windows Installer on the
      # user's machine (e.g. CST+8) then re-interprets that stored "local"
      # time through LocalFileTimeToFileTime, producing a LastWriteTime that
      # is ~8h behind the real build completion moment.
      #
      # Fix: advance the wall-clock we write by the expected user TZ offset
      # (UTC+8 = CST / Beijing time) BEFORE WiX packages them into the CAB.
      # Net effect: a CST user sees "build completion moment in Beijing time".
      - name: Normalize file timestamps before MSI packaging
        shell: pwsh
        run: |
          # Target: files should display "Beijing wall-clock time of the build"
          # on a CST+8 user's Explorer.
          #
          # Why the +8h offset? End-to-end flow of a MSI file timestamp:
          #   1. WiX reads each source file's LastWriteTime (in CI local tz).
          #   2. It writes that wall-clock value into the CAB as a DOS date/time
          #      entry (no tz metadata, just a literal "hh:mm YYYY-MM-DD").
          #   3. On install, Windows Installer treats that DOS entry as the
          #      user's LOCAL time and calls LocalFileTimeToFileTime() to get
          #      the NTFS UTC. i.e. NTFS_UTC = DOS_entry - user_TZ_offset.
          #   4. Explorer then displays that NTFS_UTC + user_TZ_offset back as
          #      local, which round-trips back to DOS_entry.
          # So whatever wall-clock we stamp here is exactly what a user sees.
          #
          # GH runner is UTC. Real build-completion moment in CST = UTC + 8h.
          $ntfsStamp = (Get-Date).AddHours(8)
          Write-Host "Stamping all build outputs with wall-clock: $ntfsStamp"
          Write-Host "(This will display as the Beijing-time moment of the build on CST machines.)"

          $dirs = @(
            "Application\FileConverter\bin\x64\Release",
            "Application\FileConverterExtension\bin\x64\Release",
            "Application\Uninstaller\bin\x64\Release"
          )
          $total = 0
          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              $files = Get-ChildItem $dir -Recurse -File
              foreach ($f in $files) {
                try {
                  $f.LastWriteTime  = $ntfsStamp
                  $f.CreationTime   = $ntfsStamp
                  $f.LastAccessTime = $ntfsStamp
                  $total++
                } catch { }
              }
              Write-Host "Touched $($files.Count) files in: $dir"
            }
          }
          Write-Host "Total files touched: $total"

      - name: Build Installer (MSI) with fresh timestamps
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        # BuildProjectReferences=false prevents this step from re-building the
        # FileConverter project, which would overwrite the timestamps we just
        # normalized above.
        run: |
          $slnDir = (Resolve-Path .).Path
          if (-not $slnDir.EndsWith('\')) { $slnDir = "$slnDir\" }
          msbuild Installer\Installer.wixproj /restore /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$slnDir" /p:BuildProjectReferences=false /m /v:normal /nologo

      - name: Dump diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Installer bin ==="
          if (Test-Path "Installer\bin") {
            Get-ChildItem "Installer\bin" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else { Write-Host "(empty)" }
          Write-Host "`n=== FileConverter bin ==="
          if (Test-Path "Application\FileConverter\bin") {
            Get-ChildItem "Application\FileConverter\bin" -Recurse -Include "*.exe","*.msi" |
              Select-Object FullName, Length | Format-Table -AutoSize
          }

      - name: Verify zh-CN satellite assembly
        shell: pwsh
        run: |
          $outDir = "Application\FileConverter\bin\x64\Release"
          $langDir = Join-Path $outDir "Languages"
          $stdDir  = Join-Path $outDir "zh-CN"
          $hasL = Test-Path (Join-Path $langDir "zh-CN\FileConverter.resources.dll")
          $hasS = Test-Path (Join-Path $stdDir "FileConverter.resources.dll")
          Write-Host "Legacy: $hasL | Standard: $hasS"
          if (-not ($hasL -or $hasS)) { Write-Error "zh-CN missing!"; exit 1 }
          Write-Host "All cultures:"
          Get-ChildItem $outDir -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "FileConverter.resources.dll")
          } | ForEach-Object { Write-Host "  $($_.Name)" }
          if (Test-Path $langDir) {
            Get-ChildItem $langDir -Directory | ForEach-Object { Write-Host "  (legacy) $($_.Name)" }
          }

      - name: Locate MSI installer
        id: installer_out
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Installer\bin" -Recurse -Include "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "MSI: $($msi.FullName) ($($msi.Length) bytes)"
            "installer_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            "installer_dir=$($msi.DirectoryName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No MSI found"
            "installer_path=" >> $env:GITHUB_OUTPUT
          }

      # ----- Artifacts -----
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Portable
          path: |
            Application/FileConverter/bin/x64/Release/**/*
            !Application/FileConverter/bin/x64/Release/**/*.pdb
          retention-days: 14

      - name: Upload installer (MSI)
        if: steps.installer_out.outputs.installer_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Installer
          path: ${{ steps.installer_out.outputs.installer_dir }}/*.msi
          retention-days: 14

      # Package portable build as zip for Release
      - name: Package portable zip (for Release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = "Application\FileConverter\bin\x64\Release"
          $zip = "FileConverter-Portable-x64.zip"
          # Exclude .pdb files
          $tempDir = "portable-staging"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          Copy-Item $src $tempDir -Recurse
          Get-ChildItem $tempDir -Recurse -Filter "*.pdb" | Remove-Item -Force
          Compress-Archive -Path "$tempDir\*" -DestinationPath $zip -Force
          Remove-Item $tempDir -Recurse -Force
          Write-Host "Portable zip: $zip ($(( Get-Item $zip).Length / 1MB) MB)"

      # ----- Release -----
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && steps.installer_out.outputs.installer_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.installer_out.outputs.installer_path }}
            FileConverter-Portable-x64.zip
          generate_release_notes: true
