name: Build

on:
  push:
    branches: [ integration, master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ integration, master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build FileConverter + Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET (global.json pins 8.0.x, needed for WiX 5 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Classic NuGet restore for packages.config-style projects (FileConverter, FileConverterExtension).
      - name: Restore NuGet packages (solution)
        shell: pwsh
        run: nuget restore FileConverter.sln

      # Restore the WiX installer project (SDK-style, needs dotnet restore to pull WixToolset.Sdk).
      - name: Restore Installer (WiX SDK + packages)
        shell: pwsh
        run: dotnet restore Installer\Installer.wixproj

      # ----- Build entire solution with dotnet msbuild -----
      # The original author builds via "Visual Studio 2022 → Build Solution (Release|x64)".
      # The sln only defines Release|x64 and Debug|x64 configurations. All three projects
      # (FileConverterExtension, FileConverter, Installer) are built together so that
      # $(SolutionDir) is defined, ProjectReference outputs resolve correctly, and the
      # PostBuildEvent (copy ffmpeg, gswin64c, satellite assemblies) works.
      #
      # We use `dotnet msbuild` (not `msbuild.exe` from setup-msbuild) because it can
      # resolve the WixToolset.Sdk from NuGet cache. It can also build .NET Framework 4.8
      # projects as long as the targeting pack is present (it is on windows-latest).
      - name: Build Solution (Release|x64)
        shell: pwsh
        run: dotnet msbuild FileConverter.sln -p:Configuration=Release -p:Platform=x64 -m -v:normal -bl:build.binlog

      - name: Dump build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Installer output ==="
          if (Test-Path "Installer\bin") {
            Get-ChildItem "Installer\bin" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else { Write-Host "(no Installer\bin)" }
          Write-Host "`n=== FileConverter output ==="
          if (Test-Path "Application\FileConverter\bin") {
            Get-ChildItem "Application\FileConverter\bin" -Recurse -Include "*.exe","*.dll","*.resources.dll" |
              Select-Object FullName, Length | Format-Table -AutoSize
          }

      - name: Upload binlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog
          path: build.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify satellite assemblies (zh-CN)
        shell: pwsh
        run: |
          $outDir = "Application\FileConverter\bin\x64\Release"
          $langDir = Join-Path $outDir "Languages"
          $stdDir  = Join-Path $outDir "zh-CN"

          $hasLegacy  = Test-Path (Join-Path $langDir "zh-CN\FileConverter.resources.dll")
          $hasStandard = Test-Path (Join-Path $stdDir "FileConverter.resources.dll")

          Write-Host "Legacy path:   $hasLegacy"
          Write-Host "Standard path: $hasStandard"

          if (-not ($hasLegacy -or $hasStandard)) {
            Write-Error "zh-CN satellite assembly missing!"
            exit 1
          }

          Write-Host "`n== Cultures =="
          Get-ChildItem $outDir -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "FileConverter.resources.dll")
          } | ForEach-Object { Write-Host "  $($_.Name)" }

          if (Test-Path $langDir) {
            Get-ChildItem $langDir -Directory | ForEach-Object { Write-Host "  (legacy) $($_.Name)" }
          }

      - name: Locate installer
        id: installer_out
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "Installer\bin" -Recurse -Include "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "MSI found: $($msi.FullName) ($($msi.Length) bytes)"
            Write-Output "installer_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            Write-Output "installer_dir=$($msi.DirectoryName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No MSI produced."
            Write-Output "installer_path=" >> $env:GITHUB_OUTPUT
          }

      # ----- Artifacts -----
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Portable
          path: |
            Application/FileConverter/bin/x64/Release/**/*
            !Application/FileConverter/bin/x64/Release/**/*.pdb
          retention-days: 14

      - name: Upload installer (MSI)
        if: steps.installer_out.outputs.installer_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Installer
          path: ${{ steps.installer_out.outputs.installer_dir }}/*.msi
          retention-days: 14

      # ----- Auto release on tag push -----
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && steps.installer_out.outputs.installer_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.installer_out.outputs.installer_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
