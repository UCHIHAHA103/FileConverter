name: Build

on:
  push:
    branches: [ integration, master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ integration, master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build FileConverter + Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET (needed by WiX 5 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore the application with classic NuGet (packages.config style csproj).
      - name: Restore NuGet packages (FileConverter.sln)
        shell: pwsh
        run: nuget restore FileConverter.sln

      # ----- Application build -----
      # Use a single-line MSBuild command to avoid any shell continuation quirks.
      - name: Build FileConverter (Release)
        shell: pwsh
        run: msbuild Application\FileConverter\FileConverter.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal /nologo

      - name: Dump build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== MSBuild log files ==="
          Get-ChildItem -Path "Application\FileConverter" -Recurse -Include "*.log","*.binlog","msbuild.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.FullName) ----"; Get-Content $_.FullName -Tail 100 }
          Write-Host "=== obj directory ==="
          if (Test-Path "Application\FileConverter\obj") {
            Get-ChildItem "Application\FileConverter\obj" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          }
          Write-Host "=== bin directory ==="
          if (Test-Path "Application\FileConverter\bin") {
            Get-ChildItem "Application\FileConverter\bin" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          }

      - name: Verify satellite assemblies deployed
        shell: pwsh
        run: |
          $outDir = "Application\FileConverter\bin\Release"
          Write-Host "== Output directory: $outDir =="
          if (-not (Test-Path $outDir)) {
            Write-Error "Build output directory not found: $outDir"
            exit 1
          }

          $mainExe = Join-Path $outDir "FileConverter.exe"
          if (-not (Test-Path $mainExe)) {
            Write-Error "FileConverter.exe not found."
            exit 1
          }
          Write-Host "FileConverter.exe found ($((Get-Item $mainExe).Length) bytes)."

          $langDir = Join-Path $outDir "Languages"
          $standardZhDir = Join-Path $outDir "zh-CN"

          $hasLegacy = (Test-Path (Join-Path $langDir "zh-CN\FileConverter.resources.dll"))
          $hasStandard = (Test-Path (Join-Path $standardZhDir "FileConverter.resources.dll"))

          Write-Host "Legacy path (Languages\zh-CN\FileConverter.resources.dll): $hasLegacy"
          Write-Host "Standard .NET path (zh-CN\FileConverter.resources.dll):   $hasStandard"

          if (-not ($hasLegacy -or $hasStandard)) {
            Write-Error "zh-CN satellite assembly missing from both layouts!"
            exit 1
          }

          Write-Host "`n== Cultures discovered =="
          Get-ChildItem -Path $outDir -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "FileConverter.resources.dll")
          } | ForEach-Object { Write-Host "  (standard) $($_.Name)" }

          if (Test-Path $langDir) {
            Get-ChildItem -Path $langDir -Directory | ForEach-Object {
              Write-Host "  (legacy)   $($_.Name)"
            }
          }

      # ----- Installer build (WiX 5 SDK) -----
      # WiX 5 is a pure SDK-style project (<Project Sdk="WixToolset.Sdk/5.0.2">).
      # The classic MSBuild.exe from setup-msbuild cannot resolve this SDK, so we must
      # use `dotnet build`. Restore is scoped to the wixproj only (not the whole sln),
      # which avoids disturbing the classic packages.config restore already done for
      # FileConverter.csproj.
      - name: Install WiX CLI (global tool, for diagnostics)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Restore Installer (scoped, wixproj only)
        shell: pwsh
        continue-on-error: true
        id: wix_restore
        run: |
          Write-Host "== dotnet SDK info =="
          dotnet --info
          Write-Host "`n== Restoring Installer.wixproj =="
          dotnet restore Installer\Installer.wixproj --verbosity normal

      - name: Build Installer (WiX MSI) with binlog
        shell: pwsh
        continue-on-error: true
        id: wix_build
        run: |
          dotnet build Installer\Installer.wixproj -c Release -p:Platform=x64 -v normal -bl:Installer\build.binlog

      - name: Dump WiX build logs
        if: always()
        shell: pwsh
        run: |
          Write-Host "== Installer\bin ==" 
          if (Test-Path "Installer\bin") {
            Get-ChildItem "Installer\bin" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
          } else { Write-Host "(no Installer\bin)" }

          Write-Host "`n== Installer\obj =="
          if (Test-Path "Installer\obj") {
            Get-ChildItem "Installer\obj" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
          } else { Write-Host "(no Installer\obj)" }

          Write-Host "`n== Any *.wixobj / *.msi files anywhere =="
          Get-ChildItem -Recurse -Include "*.msi","*.wixobj" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload WiX binlog on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-binlog
          path: Installer/build.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate installer output
        id: installer_out
        shell: pwsh
        run: |
          $candidates = @(
            "Installer\bin\x64\Release",
            "Installer\bin\Release",
            "Installer\bin"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "Inspecting $c"
              Get-ChildItem -Path $c -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName, Length | Format-Table -AutoSize
              $match = Get-ChildItem -Path $c -Recurse -Include "*.msi","*.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($match) { $found = $match; break }
            }
          }
          if ($found) {
            Write-Host "Installer found: $($found.FullName) ($($found.Length) bytes)"
            Write-Output "installer_path=$($found.FullName)" >> $env:GITHUB_OUTPUT
            Write-Output "installer_dir=$($found.DirectoryName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No installer (.msi/.exe) produced. WiX build may have failed - check logs above."
            Write-Output "installer_path=" >> $env:GITHUB_OUTPUT
            Write-Output "installer_dir=" >> $env:GITHUB_OUTPUT
          }

      # ----- Artifacts -----
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Portable
          path: |
            Application/FileConverter/bin/Release/**/*
            !Application/FileConverter/bin/Release/**/*.pdb
          retention-days: 14

      - name: Upload installer
        if: steps.installer_out.outputs.installer_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Installer
          path: ${{ steps.installer_out.outputs.installer_dir }}/*.msi
          retention-days: 14

      # ----- Auto release on tag push -----
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && steps.installer_out.outputs.installer_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.installer_out.outputs.installer_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
